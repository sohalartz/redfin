name: Build Pixel 5 Docker Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            git curl zip lz4 python3 python-is-python3 ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5 libtinfo5 \
            cpio binutils || true

      - name: Download Proton-Clang Compiler
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS 23.2 Pixel 5 Kernel
        run: |
          git clone https://github.com/LineageOS/android_kernel_google_redbull.git -b lineage-23.2 --depth=1 kernel

      - name: Patch Defconfig & DTS for Docker Support
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/redbull_defconfig"

          # 1. Enable PID Namespaces (explicitly disabled by Google)
          sed -i 's/# CONFIG_PID_NS is not set/CONFIG_PID_NS=y/' $DEFCONFIG

          # 2. Enable Fair Group Scheduling (required for CPU bandwidth quota)
          sed -i 's/# CONFIG_FAIR_GROUP_SCHED is not set/CONFIG_FAIR_GROUP_SCHED=y/' $DEFCONFIG

          # 3. Disable LTO & CFI for standalone Clang compilation
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' $DEFCONFIG
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG

          # 4. Disable auto localversion to keep vermagic clean
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' $DEFCONFIG

          # 5. Append required Docker, cgroup, and networking configurations
          cat << 'EOF' >> $DEFCONFIG

          # --- Container & Docker Support ---
          CONFIG_USER_NS=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_POSIX_MQUEUE=y

          # Networking & Netfilter for Docker
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_RAW=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          EOF

          # 6. Fix prototype DTS error in lito-redfin-dev.dtsi
          sed -i '/\/delete-node\/ disp_pins;/d' arch/arm64/boot/dts/google/lito-redfin-dev.dtsi

      - name: Compile Kernel & Matching Modules
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            redbull_defconfig

          # Compile both Image.lz4 and all kernel modules
          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.lz4 modules -j$(nproc --all)

          # Install modules to staging directory
          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            INSTALL_MOD_PATH=$GITHUB_WORKSPACE/modules_out \
            modules_install

          echo "Kernel compiled successfully:"
          ls -lh out/arch/arm64/boot/Image.lz4

      - name: Package with AnyKernel3 (with Modules)
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          cd anykernel
          sed -i 's/device.name1=.*/device.name1=redfin/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bramble/' anykernel.sh
          sed -i 's/do.modules=0/do.modules=1/' anykernel.sh
          sed -i 's/do.systemless=1/do.systemless=1/' anykernel.sh

          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.lz4 .

          # Place compiled modules into AnyKernel3 module directory
          mkdir -p modules/vendor/lib/modules
          find $GITHUB_WORKSPACE/modules_out -name "*.ko" -exec cp {} modules/vendor/lib/modules/ \;
          echo "Copied modules to AnyKernel3 package:"
          ls modules/vendor/lib/modules | wc -l

          zip -r9 $GITHUB_WORKSPACE/AnyKernel3-LineageOS23.2-Docker-redfin.zip * -x .git README.md *placeholder

      - name: Build 96MB AVB-Signed boot.img
        run: |
          # 1. Download official stock boot.img
          curl -sL https://mirrorbits.lineageos.org/full/redfin/20260907/boot.img -o stock_boot.img

          # 2. Download official AOSP boot & AVB tools
          git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools
          git clone --depth=1 https://android.googlesource.com/platform/external/avb avb_tools

          # 3. Unpack stock boot.img to extract ramdisk
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img stock_boot.img --out stock_unpacked

          # 4. Repack Docker boot.img with extracted stock ramdisk
          python3 mkbootimg_tools/mkbootimg.py \
            --header_version 3 \
            --os_version 16.0.0 \
            --os_patch_level 2026-08 \
            --kernel $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.lz4 \
            --ramdisk stock_unpacked/ramdisk \
            -o boot-docker-raw.img

          # 5. Sign with AVB 2.0 footer and pad to exactly 96 MB (100,663,296 bytes)
          python3 avb_tools/avbtool.py add_hash_footer \
            --image boot-docker-raw.img \
            --partition_size 100663296 \
            --partition_name boot \
            --hash_algorithm sha256 \
            --salt c9cfcce701396e09844a736f351a4499e64a067948657e4bcbf3b49884e19691

          mv boot-docker-raw.img $GITHUB_WORKSPACE/boot-docker-redfin.img

          echo "Generated boot.img:"
          ls -lh $GITHUB_WORKSPACE/boot-docker-redfin.img

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel5-Docker-Kernel
          path: |
            AnyKernel3-LineageOS23.2-Docker-redfin.zip
            boot-docker-redfin.img
