name: Build Pixel 5 Docker Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            git curl zip lz4 python3 python-is-python3 ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5 libtinfo5 || true

      - name: Download Proton-Clang Compiler
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone LineageOS 23.2 Pixel 5 Kernel
        run: |
          git clone https://github.com/LineageOS/android_kernel_google_redbull.git -b lineage-23.2 --depth=1 kernel

      - name: Patch Defconfig for Docker Support & Standalone LLVM
        run: |
          cd kernel
          DEFCONFIG="arch/arm64/configs/redbull_defconfig"

          # 1. Enable PID Namespaces (explicitly disabled by Google)
          sed -i 's/# CONFIG_PID_NS is not set/CONFIG_PID_NS=y/' $DEFCONFIG

          # 2. Enable Fair Group Scheduling (required for CPU bandwidth quota)
          sed -i 's/# CONFIG_FAIR_GROUP_SCHED is not set/CONFIG_FAIR_GROUP_SCHED=y/' $DEFCONFIG

          # 3. Disable LTO & CFI for clean standalone Clang compilation
          sed -i 's/CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/' $DEFCONFIG
          sed -i 's/CONFIG_CFI_CLANG=y/# CONFIG_CFI_CLANG is not set/' $DEFCONFIG
          echo "CONFIG_LTO_NONE=y" >> $DEFCONFIG

          # 4. Append required Docker, cgroup, and networking configurations
          cat << 'EOF' >> $DEFCONFIG

          # --- Container & Docker Support ---
          CONFIG_USER_NS=y
          CONFIG_CFS_BANDWIDTH=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_BLK_DEV_THROTTLING=y
          CONFIG_POSIX_MQUEUE=y

          # Networking & Netfilter for Docker
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NETFILTER_XT_MATCH_IPVS=y
          CONFIG_NETFILTER_XT_MARK=y
          CONFIG_IP_NF_RAW=y
          CONFIG_IP_NF_TARGET_REDIRECT=y
          CONFIG_IP6_NF_TARGET_MASQUERADE=y
          CONFIG_MACVLAN=y
          CONFIG_IPVLAN=y
          CONFIG_VXLAN=y
          EOF

      - name: Compile Kernel (Image.lz4 & dtbo.img)
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          cd kernel
          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            redbull_defconfig

          make O=out ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.lz4 dtbo.img -j$(nproc --all)

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 anykernel
          cd anykernel
          sed -i 's/device.name1=.*/device.name1=redfin/' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=bramble/' anykernel.sh
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.lz4 .
          if [ -f $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img ]; then
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/dtbo.img .
          fi
          zip -r9 $GITHUB_WORKSPACE/AnyKernel3-LineageOS23.2-Docker-redfin.zip * -x .git README.md *placeholder

      - name: Repack Official boot.img
        run: |
          # 1. Download official stock boot.img
          curl -sL https://mirrorbits.lineageos.org/full/redfin/20260907/boot.img -o stock_boot.img

          # 2. Extract magiskboot binary from official Magisk APK
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -o Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          # 3. Unpack stock boot.img, replace kernel, and repack
          ./magiskboot unpack stock_boot.img
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image.lz4 kernel
          ./magiskboot repack stock_boot.img $GITHUB_WORKSPACE/boot-docker-redfin.img

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pixel5-Docker-Kernel
          path: |
            AnyKernel3-LineageOS23.2-Docker-redfin.zip
            boot-docker-redfin.img
